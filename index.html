<style>
:root{
  --bg:#f6f7f9;--card:#fff;--fg:#1d2129;--sub:#6b7280;--line:#e5e7eb;--chip:#f1f3f5;
  --accent:#2563eb;--accent-soft:#e8efff;--hot:#e5484d;--new:#16a34a;--warn:#d97706;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111317;--card:#1a1d23;--fg:#e6e8eb;--sub:#9aa1ab;--line:#2a2f37;--chip:#23272e;
  --accent:#6b9cff;--accent-soft:#1d2a44;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:16px;padding:14px 0 8px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650}
.meta{color:var(--sub);font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--sub);white-space:nowrap}
.tab.on{color:var(--fg);border-color:var(--accent);font-weight:600}
.tab .n{font-size:11px;background:var(--chip);border-radius:8px;padding:0 6px;margin-left:4px}
.bar{display:flex;gap:8px;align-items:center;padding:12px 0;flex-wrap:wrap}
input[type=search]{flex:1;min-width:200px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:14px}
.chip{padding:4px 10px;border-radius:14px;background:var(--chip);cursor:pointer;font-size:12px;user-select:none;border:1px solid transparent}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
main{padding:12px 0 60px}
.note{background:var(--accent-soft);color:var(--fg);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.update-warning{background:#b91c1c;color:#fff;padding:9px 14px;text-align:center;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:44px 1fr auto;gap:12px}
.rk{font-size:20px;font-weight:700;color:var(--sub);text-align:center;line-height:1.2}
.rk small{display:block;font-size:11px;font-weight:500}
.card:nth-child(-n+3) .rk{color:var(--hot)}
.ttl{font-size:16px;font-weight:600;margin:0 0 4px}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-right:4px;vertical-align:2px}
.b-new{background:var(--new);color:#fff}
.b-up{color:var(--new)}.b-down{color:var(--sub)}
.b-tag,.b-material{background:var(--chip);color:var(--sub)}
.b-cat{background:var(--accent-soft);color:#1d4ed8}       /* 浅色模式字色单独加深，保证小字对比度 ≥ 4.5 */
.b-cat2{background:var(--chip);color:#4b5563}
@media (prefers-color-scheme:dark){.b-cat{color:var(--accent)}.b-cat2{color:var(--sub)}}
.board li .badge{margin:0 0 0 4px;flex:none;align-self:center}
.wxbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.wxbox input[type=search]{min-width:240px}
.wxbox .acts{margin:8px 0 0}
.wxmsg{font-size:12px;color:var(--sub);margin-top:6px;min-height:16px}
.wxr{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:6px}
.monitor-tools{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.monitor-tools input{flex:1;min-width:220px}
.monitor-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.monitor-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.monitor-profile{margin:6px 0;color:var(--sub);font-size:13px}
.monitor-profile div{margin:2px 0}
.monitor-stats{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}
.monitor-stats b{font-size:18px;margin-right:3px}
.monitor-list{margin:8px 0 0;padding-left:22px}
.monitor-list li{margin:5px 0}
.monitor-status{font-size:12px;color:var(--sub)}
.monitor-status.bad{color:var(--warn)}
button:disabled{opacity:.45;cursor:not-allowed}
.b-ev{background:#fff1e6;color:#c2410c;cursor:pointer}
@media (prefers-color-scheme:dark){.b-ev{background:#3a2316;color:#fdba74}}
.score{width:110px;font-size:12px;color:var(--sub)}
.score .big{font-size:26px;font-weight:700;color:var(--fg);line-height:1.2;cursor:help}
.score-value-nowrap{white-space:nowrap}
.score-unit{font-size:12px;font-weight:500;margin-left:2px}
.score .sub{margin-top:8px}
.acts{margin-top:8px;display:flex;gap:6px}
button{font:inherit;font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
.upd{margin-left:auto;display:flex;align-items:center;gap:10px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);padding:5px 14px;font-size:13px}
button.primary:hover{color:#fff;opacity:.9}
button:disabled{opacity:.6;cursor:wait}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.board{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.board h3{margin:0;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.board ol{list-style:none;margin:0;padding:6px 0}
.board li{padding:4px 14px;display:flex;gap:8px;font-size:13px}
.board li .i{width:20px;color:var(--sub);text-align:right;flex:none}
.board li:nth-child(-n+3) .i{color:var(--hot);font-weight:700}
.board li .t{flex:1}
.board li:not(.sub-item) > .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board.wide{grid-column:1 / -1}
.board.wide li > .t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;white-space:normal;overflow-wrap:anywhere}
.board.wide li .lb{display:flex;gap:8px;align-items:center;min-width:0}
.board.wide .wt{flex:1;min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.board.wide .wt .t{word-break:normal;display:inline}
.board.wide .wm{flex:none;white-space:nowrap;color:var(--sub);font-size:11px}
@media (max-width:600px){.board.wide li .lb{flex-direction:column;align-items:stretch;gap:2px}.board.wide .wm{white-space:normal;margin-top:2px}}
.board li.sub-item{align-items:flex-start}
.board li .lb{flex:1;min-width:0}
.board li .lb .t{display:block;word-break:break-all}
.board li .sub{margin-top:2px;line-height:1.5}
.board li .h{color:var(--sub);font-size:11px;white-space:nowrap}
.empty{color:var(--sub);text-align:center;padding:60px 0}

@media (max-width:640px){.card{grid-template-columns:32px 1fr}.score{grid-column:2;width:auto}}

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeUrl(u){ const value=typeof u==='string' ? u.trim() : ''; return /^https?:\/\//i.test(value) ? value : '#'; }
const PUBLIC = true;   // 公网版：不显示面向站主的运维提示
const updateWarning = $('#update-warning');
const hhmm = value => { const hit = String(value || '').match(/(?:^|\s|T)(\d{2}:\d{2})(?::\d{2})?/); return hit ? hit[1] : '--:--'; };
function renderUpdateWarning(updateStatus){
  if (PUBLIC) {
    const generated = new Date(String(D.meta?.generated || '').replace(' ', 'T'));
    const stale = Number.isFinite(generated.getTime()) && Date.now() - generated.getTime() > 3 * 60 * 60 * 1000;
    updateWarning.hidden = !stale;
    updateWarning.textContent = stale ? `数据停在 ${hhmm(D.meta.generated)}` : '';
    return;
  }
  const failures = Number.isInteger(updateStatus?.consecutive_failures) ? updateStatus.consecutive_failures : 0;
  updateWarning.hidden = failures < 1;
  updateWarning.textContent = failures > 0 ? `最后成功更新：${hhmm(updateStatus.last_success_at)}，之后 ${failures} 次失败` : '';
}
renderUpdateWarning();
if (PUBLIC) setInterval(renderUpdateWarning, 60000);

// 分类徽章：第一个是主分类（深色），其余浅色
const catBadges = cs => (cs || []).map((c,i) => `<span class="badge ${i ? 'b-cat2' : 'b-cat'}">${esc(c)}</span>`).join('');
const hasCat = x => !state.cat || (x.categories || []).includes(state.cat);

// 「新」= 24 小时内首次登上该平台榜单；上榜时长按 first_seen 算，不到 1 小时显示「刚刚」
const newAge = ts => { if (!ts) return ''; const h = (Date.now()/1000 - ts) / 3600; return h < 1 ? '刚刚' : Math.floor(h) + ' 小时前上榜'; };
const platformBoards = () => D.boards.filter(b => !b.key.startsWith('theme_'));
const TABS = [
  
  ['wechat_hot','微信热文', () => visibleBoardCount('wechat_hot')],
  ['lowfan_hot','低粉爆文', () => visibleBoardCount('lowfan_hot')],
  ['wxs','检索微信文章', () => (D.meta.wechat_search?.keywords || []).length],
  ['monitor','公众号监控', () => (D.monitor?.accounts || []).length],
].filter(([key]) => !['wechat_hot', 'lowfan_hot'].includes(key) || D.wx_tab);
const DEFAULT_TAB = TABS.length ? TABS[0][0] : 'wxs';
const requestedTab = new URLSearchParams(location.search).get('tab');
const state = {
  tab: TABS.some(([key]) => key === requestedTab) ? requestedTab : DEFAULT_TAB,
  q:'', cat:'', wxq:'', monitorViewed:{}
};

function renderHeader(){
  const m = D.meta;
  const platformCount = D.status.length;
  $('#meta').textContent = `${m.generated} 更新 · ${m.ok_sources}/${platformCount} 个平台 · ${m.total_items} 条 → ${D.topics.length} 个话题`;
  $('#tabs').innerHTML = TABS.map(([k,n,c]) => {
    const count = c();
    return `<div class="tab ${state.tab===k?'on':''}" data-tab="${k}">${n}${count === '' ? '' : `<span class="n">${count}</span>`}</div>`;
  }).join('');
  document.querySelectorAll('.tab').forEach(el => el.onclick = () => {
    state.tab = el.dataset.tab;
    render();
  });
}

function renderBar(){
  const t = state.tab;
  
  if (['elder', 'monitor', 'wxs'].includes(t)) { $('#bar').innerHTML = ''; return; }
  const categories = [...D.meta.categories, '其他'];
  const chips = `<span class="meta">分类：</span><span class="chip ${state.cat ? '' : 'on'}" data-cat="">全部</span>${[...new Set(categories)].map(c=>`<span class="chip ${state.cat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</span>`).join('')}`;
  const search = `<input type="search" id="q" placeholder="搜索标题 / 关键词…" value="${esc(state.q)}">`;
  $('#bar').innerHTML = search + chips;
  if ($('#q')) $('#q').oninput = e => { state.q = e.target.value; renderMain(); };
  document.querySelectorAll('[data-cat]').forEach(el => el.onclick = () => {
    const c = el.dataset.cat; state.cat = (c && state.cat === c) ? '' : c; render(); });
}

const safeWxUrl = u => typeof u === 'string' && u.startsWith('https://mp.weixin.qq.com/') ? u : '';

// 右侧栏：大号数字 + 标签 + 一行小字
const sideBox = (label, big, tip, cats, foot, tagLabel = '所属标签') => `<div class="score"><div>${label}</div><div class="big" title="${esc(tip)}">${big}</div>
      <div class="sub">${tagLabel}</div><div>${catBadges(cats)}</div><div class="meta">${foot}</div></div>`;

function bindCardActions(items){
  document.querySelectorAll('[data-cardtitle]').forEach(b => b.onclick = () => {
    const item = items[+b.dataset.cardtitle];
    if (!item) return;
    navigator.clipboard.writeText(item.title); b.textContent = '已复制'; setTimeout(()=>b.textContent='复制标题', 1200);
  });
}

function statusLine(){
  const bad = D.status.filter(s => s.error || s.ok === false), ws = D.meta.wechat_search || {};
  const warnings = D.status.filter(s => s.warning).map(s => `${esc(s.name)}：${esc(s.warning)}`);
  return (bad.length ? `<div class="note">⚠️ ${bad.map(s=>esc(s.name)).join('、')} 抓取失败（接口变动或限流），其余平台不受影响。</div>` : '')
    + (warnings.length ? `<div class="note">${warnings.join('<br>')}</div>` : '')
    + (PUBLIC ? '' : ws.blocked ? '<div class="note">⚠️ 搜狗触发验证，已停止本轮题材检索。</div>' : '')
    + (PUBLIC ? '' : !ws.blocked && ws.failed ? `<div class="note">⚠️ 有 ${ws.failed} 个关键词检索失败，详情见「检索微信文章」。</div>` : '');
}

function renderBoardCard(b, q){
  const items = b.wide ? b.items : b.items.filter(i => (!q || i.title.toLowerCase().includes(q)) && hasCat(i));
  const emptyText = !b.items.length && b.empty_text ? b.empty_text
    : state.cat === '其他' ? '没有归入其他的内容' : '没有这个分类的内容';
  const newBadge = i => i.is_new ? `<span class="badge b-new" title="${esc(newAge(i.first_seen))}">新</span>` : '';
  const cardCount = items.length === b.items.length ? items.length : items.length + '/' + b.items.length;
  return `<div class="board${b.wide ? ' wide' : ''}"><h3>${b.home ? `<a href="${esc(safeUrl(b.home))}" target="_blank">${esc(b.name)}</a>` : esc(b.name)}<span class="meta">${b.group ? esc(b.group) + ' · ' : ''}${cardCount}</span></h3><ol>${
    items.map(i => {
      const rise = i.rank_change > 0 ? `<span class="b-up"> ↑${i.rank_change}</span>` : '';
      if (i.sub && !b.wide) return `<li class="sub-item"><span class="i">${i.rank}</span><div class="lb"><a class="t" href="${esc(safeUrl(i.url))}" target="_blank">${newBadge(i)}${esc(i.title)}${rise}</a><div class="meta sub">${esc(i.sub).replace(/爆发 ([\d.]+) ?倍/, '爆发 <b>$1</b> 倍')}<span class="h"> · ${esc(i.hot_text || fmtHot(i.hot))}</span> ${catBadges(i.categories)}</div></div></li>`;
      const title = i.url ? `<a class="t" href="${esc(safeUrl(i.url))}" target="_blank" title="${esc(i.title)}">${esc(i.title)}</a>`
        : `<span class="t" title="${esc(i.title)}">${esc(i.title)}</span>`;
      const material = i.material ? '<span class="badge b-material">素材</span>' : '';
      const anniversary = i.anniversary ? `<span class="badge b-tag">${esc(i.anniversary)}</span>` : '';
      const heat = i.hot_text || fmtHot(i.hot);
      const detail = b.wide ? [i.source_name, heat].filter(Boolean).join(' · ') : heat;
      if (b.wide) return `<li><span class="i">${i.rank}</span><div class="lb"><div class="wt">${newBadge(i)}${title}${material}${anniversary}</div><div class="wm">${esc(detail)} ${catBadges(i.categories)}</div></div></li>`;
      return `<li><span class="i">${i.rank}</span>${newBadge(i)}${title}${rise}${material}${anniversary}<span class="h">${esc(detail)}</span>${catBadges(i.categories)}</li>`;
    }).join('') || `<div class="empty">${esc(emptyText)}</div>`}</ol></div>`;
}
function renderBoards(){
  const q = state.q.trim().toLowerCase();
  $('#main').innerHTML = statusLine() + baselineNote() + `<div class="grid">${platformBoards().map(b => renderBoardCard(b, q)).join('')}</div>`;
}
function renderElder(){
  $('#main').innerHTML = statusLine() + `<div class="grid">${D.elder_boards.map(b => renderBoardCard(b, '')).join('')}</div>`;
}
const visibleBoardCount = key => ((D.boards.find(b => b.key === key) || {}).items || []).length;
// 微信热文和低粉爆文共用卡片：重新编号，保留榜单原序号。
const cleanCardSub = (key, item) => String(item.sub || '').split(' · ').map(x => x.trim()).filter(x => {
  if (!x) return false;
  if (key === 'wechat_hot') return !/^榜内第\s*\d+\s*名$/.test(x) && !/^\d+(?:\.\d+)?万\+阅读$/.test(x);
  if (key === 'lowfan_hot') return !/^爆发\s*[\d.]+\s*倍$/.test(x) && !/^阅读\s*/.test(x);
  return !/^\d{2}-\d{2}\s+\d{2}:\d{2}(?:\s*发布)?$/.test(x);
}).join(' · ');

function renderCards(key, note){
  const q = state.q.trim().toLowerCase();
  const boards = D.boards.filter(b => b.key === key);
  const staleAt = (boards.find(b => b.data_updated_at) || {}).data_updated_at;
  if (staleAt) note = '数据更新于 ' + staleAt + '。' + (note || '');
  if (!boards.length) { $('#main').innerHTML = '<div class="empty">暂无数据</div>'; return; }
  const sourceItems = boards.flatMap(board => board.items);
  const items = sourceItems
    .filter(i => hasCat(i) && (!q || i.title.toLowerCase().includes(q)));
  const cards = items.map((item, index) => {
    const url = safeWxUrl(item.url);
    const hot = String(item.hot_text || '');
    const reads = hot.replace(/阅读/g, '');
    const meta = cleanCardSub(key, item);
    const burst = String(item.sub || '').match(/爆发 ([\d.]+) ?倍/);
    const side = key === 'lowfan_hot'
      ? sideBox('爆发', burst ? esc(burst[1]) + '倍' : '—', item.sub || '', item.categories, `阅读 ${esc(reads || '—')}`)
      : sideBox('阅读', esc(reads || '—'), item.hot_text || '', item.categories, `榜内第 ${esc(item.rank)} 名`);
    return `<div class="card">
      <div class="rk">${index + 1}<small>#${esc(item.rank)}</small></div>
      <div>
        <div class="ttl">${url ? `<a href="${esc(safeUrl(url))}" target="_blank">${esc(item.title)}</a>` : esc(item.title)}</div>
        <div class="meta">${esc(meta)}</div>
        <div class="acts"><button data-cardtitle="${index}">复制标题</button></div>
      </div>
      ${side}
    </div>`;
  }).join('');
  $('#main').innerHTML = `<p class="meta">${esc(note)}</p>`
    + (cards ? `<div class="wxcards">${cards}</div>` : '<div class="empty">没有符合条件的文章</div>');
  bindCardActions(items);
}
const fmtHot = h => !h ? '' : h >= 1e8 ? (h/1e8).toFixed(1)+'亿' : h >= 1e4 ? (h/1e4).toFixed(h>=1e6?0:1)+'万' : String(Math.round(h));

// 数字统一用 万/亿：790.5万、1211万、1.23亿
// 名次/指数的涨跌都和「约 24 小时前的快照」比，不是上一次更新；没有基准时如实提示
const baselineNote = () => { const b = D.meta.baseline || {};
  return b.available ? `<div class="note">名次、指数的涨跌对比的是约 24 小时前（${b.at}）的快照，不是上一次更新。</div>`
    : `<div class="note">对比数据不足：名次、指数的涨跌对比的是约 24 小时前的快照，需要至少 1 天的历史数据${b.since ? `（历史数据从 ${b.since} 开始记录）` : ''}。</div>`; };
// 平台自带的标记：微博 label_name、头条 LabelDesc、百度 hotTag=3（页面上显示「热」）；抖音的 label 数字没法核实含义，不显示
const officialBadge = p => { const b = p.badge || {};
  const t = p.source === 'weibo' ? b.label_name : p.source === 'toutiao' ? b.LabelDesc : (p.source === 'baidu' && String(b.hotTag) === '3') ? '热' : '';
  return t ? `<span class="badge b-tag">${esc(t)}</span>` : ''; };
const fmtIdx = v => v == null ? '—' : v >= 1e8 ? (v/1e8).toFixed(2)+'亿' : v >= 1e7 ? Math.round(v/1e4)+'万' : v >= 1e4 ? (v/1e4).toFixed(1)+'万' : String(Math.round(v));
const idxChange = p => !(D.meta.baseline || {}).available ? '<span class="meta">—</span>' : p.is_new ? '<span class="badge b-new">新</span>'
  : p.change == null ? '' : Math.abs(p.change) < 0.005 ? '<span class="meta">持平</span>'
  : p.change > 0 ? `<span class="b-up">↑${Math.round(p.change*100)}%</span>` : `<span class="b-down">↓${Math.round(-p.change*100)}%</span>`;
const sinceAge = ts => { const h = (Date.now()/1000 - ts) / 3600; return h < 1 ? '刚刚' : Math.floor(h) + ' 小时前'; };
// ---- 页面显示后台已有的题材检索结果；手动搜索时由访问者打开搜狗微信。
const WX_GAP_MS = 3000;
const WX_LIMIT = (D.meta.wx_search_daily_limit ?? 30);
const wxToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const wxMem = {};   // localStorage 不可用（隐私模式）时退回内存计数
const wxGet = k => { try { return localStorage.getItem(k); } catch (e) { return wxMem[k] ?? null; } };
const wxSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { wxMem[k] = String(v); } };
function wxUsed(){   // 按自然日计数（key 带日期），顺手清掉往天的
  const key = 'wxs-count-' + wxToday();
  try { Object.keys(localStorage).filter(k => k.startsWith('wxs-count-') && k !== key).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  return +(wxGet(key) || 0);
}
const wxLeft = () => Math.max(0, WX_LIMIT - wxUsed());
function wxCopy(text){
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return ok; };
  return (navigator.clipboard && navigator.clipboard.writeText) ? navigator.clipboard.writeText(text).then(() => true, fallback) : Promise.resolve(fallback());
}
window.__goWeixin = () => { location.href = 'weixin://'; };   // 单独挂在 window 上，方便测试时替换
function wxMsg(t){ const m = $('#wxmsg'); if (m) m.textContent = t; }
function wxRefresh(){
  const left = wxLeft();
  document.querySelectorAll('[data-wxgo]').forEach(b => b.disabled = left <= 0);
  const r = $('#wxleft'); if (r) r.textContent = left > 0 ? `今日剩余 ${left} 次` : '今日检索次数已用完，明天再来';
}
function wxSearch(kw){
  kw = (kw || '').trim();
  if (!kw) { wxMsg('请先输入关键词'); return; }
  if (wxLeft() <= 0) { wxMsg('今日检索次数已用完，明天再来'); wxRefresh(); return; }
  const last = +(wxGet('wxs-last') || 0), wait = WX_GAP_MS - (Date.now() - last);
  if (wait > 0) { wxMsg(`两次搜索至少间隔 3 秒，请 ${Math.ceil(wait/1000)} 秒后再试`); return; }
  wxSet('wxs-last', Date.now()); wxSet('wxs-count-' + wxToday(), wxUsed() + 1);
  window.open('https://weixin.sogou.com/weixin?type=2&query=' + encodeURIComponent(kw), '_blank', 'noopener,noreferrer');
  wxMsg(`已在新标签页打开搜狗微信搜索「${kw}」`); wxRefresh();
}
function wxCopyGo(kw){
  kw = (kw || '').trim();
  if (!kw) { wxMsg('请先输入关键词'); return; }
  const ua = navigator.userAgent, inWx = /MicroMessenger/i.test(ua), mobile = /iPhone|Android/i.test(ua) && !inWx;
  wxCopy(kw).then(ok => {
    if (!ok) { wxMsg('复制失败，请手动复制关键词：' + kw); return; }
    if (inWx) wxMsg('已复制，返回微信顶部搜索框粘贴');
    else if (mobile) { wxMsg('已复制，正在打开微信，到搜一搜里粘贴…'); setTimeout(() => window.__goWeixin(), 300); }
    else wxMsg('已复制，到手机或电脑微信的搜一搜里粘贴');
  });
}
function wxThemeResult(row){
  const articles = row.wechat_articles || [];
  const label = {
    empty:'未搜到文章', not_cached:'暂无缓存', deferred:'等待下轮检索',
    failed:'检索失败', blocked:'触发搜狗验证', skipped:'本轮跳过', disabled:'后台检索未开启'
  }[row.status] || '暂无检索状态';
  const cacheNote = row.wechat_stale ? '（旧缓存）' : '';
  if (!articles.length) return `<div class="meta">${esc(label + cacheNote)}</div>`;
  return `<details><summary>搜狗首页 ${esc(row.wechat_page_n)} 篇 · 近 24 小时 ${esc(row.wechat_24h)} 篇${cacheNote}</summary>
    <ul>${articles.map(article => `<li><a href="${esc(safeUrl(article.url))}" target="_blank" rel="noopener noreferrer">${esc(article.title)}</a> <span class="meta">${esc(article.account)}</span></li>`).join('')}</ul></details>`;
}
const sogouSearchUrl = q => 'https://www.sogou.com/iweixin?tab=weixin_vertical&query=' + encodeURIComponent(q);
const SOGOU_NOTE = '搜狗已改版且禁止自动抓取，点关键词在浏览器里看最新文章。';
function renderWxs(){
  const R = D.meta.wechat_search?.keywords || [];
  $('#main').innerHTML = `<div class="note">${esc(SOGOU_NOTE)}</div>` + (R.length
    ? `<div class="wxcards">${R.map((t,i) => `<div class="wxr"><div class="rk">${i+1}</div>
        <div><div class="ttl">${esc(t.title)}</div></div>
        <div><a class="primary" href="${esc(safeUrl(sogouSearchUrl(t.wx_keyword || t.title)))}" target="_blank" rel="noopener noreferrer">在浏览器里搜</a></div></div>`).join('')}</div>`
    : '<div class="empty">暂无题材关键词</div>');
}

// ---- 公众号监控：「查看」时间选择存在浏览器 localStorage，不为每次查看发服务器请求。
const monDate = value => { if(!value)return null; let text=String(value); if(/^\d{1,2}-\d{1,2}(?:\s|$)/.test(text))text=`${new Date().getFullYear()}-${text}`; return new Date(text.replace(' ', 'T')); };
const monFmt = (value, full=false) => { const d=monDate(value); if (!d || Number.isNaN(d.getTime())) return '—';
  const opt = full ? {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false} : {hour:'2-digit',minute:'2-digit',hour12:false};
  return d.toLocaleString('zh-CN', opt).replace(/\//g,'-'); };
function monViewedBefore(name){
  if (PUBLIC) return null;
  if (!(name in state.monitorViewed)) {
    const key = 'monitor-viewed-' + name;
    let old = ''; try { old = localStorage.getItem(key) || ''; localStorage.setItem(key, new Date().toISOString()); } catch(e) {}
    state.monitorViewed[name] = old;
  }
  return monDate(state.monitorViewed[name]);
}
function renderMonitor(){
  if (!PUBLIC && window.loadMonitor && !window.monitorLoaded) window.loadMonitor();
  const accounts = D.monitor?.accounts || [];
  const tools = PUBLIC ? '' : `<div class="monitor-tools"><input id="monname" type="search" maxlength="30" placeholder="输入公众号名（1~30 个字符）"><button id="monadd" class="primary">添加监控</button><span id="monmsg" class="monitor-status"></span></div>`;
  const note = `<div class="note">搜狗已改版且禁止自动抓取，点号名在浏览器里看最新文章。</div>`;
  const rows = accounts.map(a => `<section class="monitor-card"><div class="monitor-head"><div><a class="ttl" href="${esc(safeUrl(sogouSearchUrl(a.name)))}" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">${esc(a.name)}</a></div><div class="acts"><a class="primary" href="${esc(safeUrl(sogouSearchUrl(a.name)))}" target="_blank" rel="noopener noreferrer">在浏览器里搜</a>${PUBLIC || a.configured_only ? '' : ` <button data-monremove="${esc(a.name)}">移除</button>`}</div></div></section>`).join('');
  $('#main').innerHTML = tools + note + (rows || `<div class="empty">还没有监控的公众号</div>`);
  if (!PUBLIC && window.bindMonitorActions) window.bindMonitorActions();
}
const onBoard = h => h == null ? '' : h >= 48 ? Math.floor(h/24) + ' 天' : Math.floor(h) + ' 小时';
const onBoardShort = h => h == null ? '' : h >= 48 ? Math.floor(h/24) + '天' : Math.floor(h) + 'h';
function renderHealthFeeds(health){
  // 行业/政策类默认显示（灰色「行业」标签），勾选「隐藏行业/政策类」后才收起。
  let hideIndustry = false;
  try { hideIndustry = localStorage.getItem('health-hide-industry') === '1'; } catch(e) {}
  const statuses = sources => (health.statuses || []).filter(source => sources.includes(source.source)).map(source => `<div class="meta">${esc(source.name)}${(source.messages || []).map(message => `<div>${esc(message)}</div>`).join('')}</div>`).join('');
  const cards = (items, industryToggle) => items.length ? items.map(item => `<article class="note" ${industryToggle && item.category === '行业' ? `data-health-industry ${hideIndustry ? 'hidden' : ''}` : ''}>
    <a href="${esc(safeUrl(item.url))}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a>
    <div class="meta">${esc(item.source_name)} · ${esc(item.date)}${item.category === '行业' ? ' · <span style="color:#888888">行业</span>' : ''}</div></article>`).join('') : '<div class="empty">暂无带发布日期的缓存文章</div>';
  return `<section><h3>健康科普新文</h3><div class="meta">最近 14 天，按发布日期倒序</div>
    <label><input id="health-industry" type="checkbox" ${hideIndustry ? 'checked' : ''}>隐藏行业/政策类</label>
    ${statuses(['people', 'jkb'])}${cards(health.news || [], true)}</section>
    <section><h3>丁香医生常青科普</h3><div class="meta">常青科普，非当日新闻</div>${statuses(['dxy'])}${cards(health.evergreen || [], false)}</section>`;
}



function renderMain(){
  switch (state.tab){
    case 'elder': return renderElder();
    
    case 'wechat_hot': renderCards('wechat_hot', '来源：第三方聚合（试用），榜内排名。'); break;
    case 'lowfan_hot': renderCards('lowfan_hot', '来源：第三方聚合（试用），T+1 榜单（榜单日期见每条发布日期）。爆发倍数 = 这篇阅读 ÷ 账号日常阅读。'); break;
    case 'boards': return renderBoards();
    case 'wxs': return renderWxs();
    case 'monitor': return renderMonitor();
  }
}
function render(){
  renderHeader();
  renderBar();
  
  renderMain();
  
}
render();


</script>
