<style>
:root{

  --accent:#2563eb;--accent-soft:#e8efff;--hot:#e5484d;--new:#16a34a;--warn:#d97706;
  --g-大众:#e5484d;--g-视频:#db2777;--g-科技:#2563eb;--g-财经:#d97706;--g-公众号:#16a34a;--g-海外:#7c3aed;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111317;--card:#1a1d23;--fg:#e6e8eb;--sub:#9aa1ab;--line:#2a2f37;--chip:#23272e;
  --accent:#6b9cff;--accent-soft:#1d2a44;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:16px;padding:14px 0 8px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650}
.meta{color:var(--sub);font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--sub);white-space:nowrap}
.tab.on{color:var(--fg);border-color:var(--accent);font-weight:600}
.tab .n{font-size:11px;background:var(--chip);border-radius:8px;padding:0 6px;margin-left:4px}
.bar{display:flex;gap:8px;align-items:center;padding:12px 0;flex-wrap:wrap}
input[type=search]{flex:1;min-width:200px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:14px}
.chip{padding:4px 10px;border-radius:14px;background:var(--chip);cursor:pointer;font-size:12px;user-select:none;border:1px solid transparent}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
main{padding:12px 0 60px}
.note{background:var(--accent-soft);color:var(--fg);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.update-warning{background:#b91c1c;color:#fff;padding:9px 14px;text-align:center;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:44px 1fr auto;gap:12px}
.rk{font-size:20px;font-weight:700;color:var(--sub);text-align:center;line-height:1.2}
.rk small{display:block;font-size:11px;font-weight:500}
.card:nth-child(-n+3) .rk{color:var(--hot)}
.ttl{font-size:16px;font-weight:600;margin:0 0 4px}
.desc{color:var(--sub);font-size:13px;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plats{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.pl{font-size:12px;padding:1px 7px;border-radius:5px;background:var(--chip);border-left:3px solid var(--sub)}
.pl b{font-weight:600}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-right:4px;vertical-align:2px}
.b-new{background:var(--new);color:#fff}
.b-up{color:var(--new)}.b-down{color:var(--sub)}
.b-tag{background:var(--chip);color:var(--sub)}
.b-cat{background:var(--accent-soft);color:#1d4ed8}       /* 浅色模式字色单独加深，保证小字对比度 ≥ 4.5 */
.b-cat2{background:var(--chip);color:#4b5563}

.board li .badge{margin:0 0 0 4px;flex:none;align-self:center}
.b-multi{background:var(--hot);color:#fff}
.wxbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.wxbox input[type=search]{min-width:240px}
.wxbox .acts{margin:8px 0 0}
.wxmsg{font-size:12px;color:var(--sub);margin-top:6px;min-height:16px}
.wxr{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:6px}
.monitor-tools{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.monitor-tools input{flex:1;min-width:220px}
.monitor-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}

.monitor-profile{margin:6px 0;color:var(--sub);font-size:13px}
.monitor-profile div{margin:2px 0}
.monitor-stats{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}
.monitor-stats b{font-size:18px;margin-right:3px}
.monitor-list{margin:8px 0 0;padding-left:22px}
.monitor-list li{margin:5px 0}
.monitor-status{font-size:12px;color:var(--sub)}
.monitor-status.bad{color:var(--warn)}
button:disabled{opacity:.45;cursor:not-allowed}
.b-ev{background:#fff1e6;color:#c2410c;cursor:pointer}

.score{width:110px;font-size:12px;color:var(--sub)}

.score-value-nowrap{white-space:nowrap}
.score-unit{font-size:12px;font-weight:500;margin-left:2px}
.score .sub{margin-top:8px}
.acts{margin-top:8px;display:flex;gap:6px}
button{font:inherit;font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
.upd{margin-left:auto;display:flex;align-items:center;gap:10px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);padding:5px 14px;font-size:13px}
button.primary:hover{color:#fff;opacity:.9}
button:disabled{opacity:.6;cursor:wait}
button.saved{background:var(--accent);color:#fff;border-color:var(--accent)}
details{font-size:12px;color:var(--sub);margin-top:4px}
details li{margin:2px 0}
.wx{margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.board{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.board h3{margin:0;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.board ol{list-style:none;margin:0;padding:6px 0;max-height:520px;overflow:auto}
.board li{padding:4px 14px;display:flex;gap:8px;font-size:13px}
.board li .i{width:20px;color:var(--sub);text-align:right;flex:none}
.board li:nth-child(-n+3) .i{color:var(--hot);font-weight:700}
.board li .t{flex:1}
.board li.sub-item{align-items:flex-start}
.board li .lb{flex:1;min-width:0}
.board li .lb .t{display:block;word-break:break-all}
.board li .sub{margin-top:2px;line-height:1.5}
.board li .h{color:var(--sub);font-size:11px;white-space:nowrap}
.pool textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--fg);font:inherit;font-size:13px;margin-top:6px}

y beneficiary of his historic meeting with President Donald Trump and Xi Jinping, returning to the global stage alongside the US and Chinese leaders despite Russia’s continuing war in Ukraine. Speaking with hosts David Gura and Christina Ruffini, Mason says the summit reflected Trump’s preference for leader-level diplomacy and explains why a Democratic-controlled Congress and Stephen Miller’s appointment as White House chief of staff are unlikely to fundamentally change the president’s foreign policy approach. (Source: Bloomberg)", "url": "https://www.bloomberg.com/news/videos/2026-11-21/putin-gains-from-trump-xi-summit-spotlight-video", "media": "彭博", "published": "2026-11-21T21:12:23+08:00", "source": "bloomberg_markets", "fetched_at": "2026-11-21T22:00:41.506356+08:00", "paywall": true, "reports": [{"media": "彭博", "title": "Putin Gains From Trump, Xi Summit Spotlight", "url": "https://www.bloomberg.com/news/videos/2026-11-21/putin-gains-from-trump-xi-summit-spotlight-video", "published": "2026-11-21T21:12:23+08:00", "paywall": true}], "media_names": ["彭博"], "report_count": 1, "media_display": "彭博", "title_zh": "Putin（普京）从Trump（特朗普）、Xi（习近平）峰会聚光灯中获益", "title_translated": true, "summary_zh": "彭博新闻白宫记者Jeff Mason（杰夫·梅森）在《Bloomberg This Weekend》（彭博本周周末）节目中告诉彭博，Vladimir Putin（弗拉基米尔·普京）成为他与President Donald Trump（唐纳德·特朗普总统）和Xi Jinping（习近平）历史性会晤的主要受益者，尽管俄罗斯在乌克兰的战争仍在持续，他仍与美中领导人一同重返全球舞台。在与主持人David Gura（大卫·古拉）和Christina Ruffini（克里斯蒂娜·鲁菲尼）交谈时，Mason说，此次峰会反映了Trump对领导人级别外交的偏好，并解释了为何民主党控制的国会以及Stephen Miller（斯蒂芬·米勒）被任命为白宫办公厅主任不太可能从根本上改变总统的外交政策方针。（来源：Bloomberg（彭博））", "summary_translated": true, "rank": 41, "title_display": "Putin（普京）从Trump（特朗普）、Xi（习近平）峰会聚光灯中获益", "summary_display": "彭博新闻白宫记者Jeff Mason（杰夫·梅森）在《Bloomberg This Weekend》（彭博本周周末）节目中告诉彭博，Vladimir Putin（弗拉基米尔·普京）成为他与President Donald Trump（唐纳德·特朗普总统）和Xi Jinping（习近平）历史性会晤的主要受益者，尽管俄罗斯在乌克兰的战争仍在持续，他仍与美中领导人一同重返全球舞台。在与主持人David Gura（大卫·古拉）和Christina Ruffini（克里斯蒂娜·鲁菲尼）交谈时，Mason说，此次峰会反映了Trump对领导人级别外交的偏好，并解释了为何民主党控制的国会以及Stephen Miller（ const PUBLIC = true;   // 公网版：不显示面向站主的运维提示
const updateWarning = $('#update-warning');
const llmWarning = $('#llm-warning');
const hhmm = value => { const hit = String(value || '').match(/(?:^|\s|T)(\d{2}:\d{2})(?::\d{2})?/); return hit ? hit[1] : '--:--'; };
function renderUpdateWarning(updateStatus){
  if (PUBLIC) {
    const generated = new Date(String(D.meta?.generated || '').replace(' ', 'T'));
    const stale = Number.isFinite(generated.getTime()) && Date.now() - generated.getTime() > 3 * 60 * 60 * 1000;
    updateWarning.hidden = !stale;
    updateWarning.textContent = stale ? `数据停在 ${hhmm(D.meta.generated)}` : '';
    return;
  }
  const failures = Number.isInteger(updateStatus?.consecutive_failures) ? updateStatus.consecutive_failures : 0;
  updateWarning.hidden = failures < 1;
  updateWarning.textContent = failures > 0 ? `最后成功更新：${hhmm(updateStatus.last_success_at)}，之后 ${failures} 次失败` : '';
}
renderUpdateWarning();
function renderLlmWarning(){
  const status = D.meta?.free_llm_status?.status;
  llmWarning.hidden = !['exhausted','key_invalid'].includes(status);
  llmWarning.textContent = status === 'exhausted' ? '免费模型额度已用完，翻译和分类已暂停' : status === 'key_invalid' ? 'Key 失效' : '';
}
renderLlmWarning();
if (PUBLIC) setInterval(renderUpdateWarning, 60000);
const POOL_KEY = 'topic-pool-v1';
const savePool = () => localStorage.setItem(POOL_KEY, JSON.stringify(pool));
const inPool = t => pool.some(p => p.title === t);
const topicById = id => D.topics.find(x => x.id === id) || (D.extra_topics || []).find(x => x.id === id);
const topicCats = title => (D.topics.find(x => x.title === title) || {}).categories || [];
// 读取时丢弃旧的 tags（突发/争议等旧标签），只保留分类；旧条目没有分类就按标题回填
let pool = JSON.parse(localStorage.getItem(POOL_KEY) || '[]').map(p => ({title:p.title, url:p.url, platforms:p.platforms, keyword_fallback:!!p.keyword_fallback, note:p.note, added:p.added,
  categories: [...new Set((p.categories || topicCats(p.title)).map(c => c === '养生' ? '健康' : c))]}));   // 旧条目里已取消的「养生」并入「健康」
savePool();

// 分类徽章：第一个是主分类（深色），其余浅色
const catBadges = cs => (cs || []).map((c,i) => `<span class="badge ${i ? 'b-cat2' : 'b-cat'}">${esc(c)}</span>`).join('');
const hasCat = x => !state.cat || (x.categories || []).includes(state.cat);

const storedPoolView = () => { try { return localStorage.getItem('pool-board') || ''; } catch(e) { return ''; } };
const normalizePoolView = value => value === 'self' ? value : 'self';
const state = {tab:'rec', q:'', minPlat:1, cat:'', wxq:'', monitorViewed:{}, poolView:normalizePoolView(storedPoolView())};
try { localStorage.setItem('pool-board', state.poolView); } catch(e) {}

// 「新」= 24 小时内首次登上该平台榜单；上榜时长按 first_seen 算，不到 1 小时显示「刚刚」
const newAge = ts => { if (!ts) return ''; const h = (Date.now()/1000 - ts) / 3600; return h < 1 ? '刚刚' : Math.floor(h) + ' 小时前上榜'; };
const newN = t => t.platforms.filter(p => p.is_new || p.rank_change > 0).length;
const TABS = [
  ['rec','热点时事', () => D.topics.length],
  ['new','新上榜', () => D.topics.filter(t => t.is_new || t.platforms.some(p => p.rank_change > 0)).length],
  ['wechat_hot','微信热文', () => visibleBoardCount('wechat_hot')],
  ['lowfan_hot','低粉爆文', () => visibleBoardCount('lowfan_hot')],
  ['boards','各平台榜单', () => D.boards.length],
  ['overseas_news','海外快讯', () => visibleOverseasNewsCount()],
  ['wxs','检索微信文章', () => Math.min(WX_TOP, D.topics.length)],
  ['monitor','公众号监控', () => (D.monitor?.accounts || []).length],
  ['pool','我的选题池', () => pool.length],
].filter(t => (t[0] !== 'overseas_news' || D.overseas_news) && (!['wechat_hot','lowfan_hot'].includes(t[0]) || D.wx_tab));

function renderHeader(){
  const m = D.meta;
  $('#meta').textContent = `${m.generated} 更新 · ${m.ok_sources}/${D.status.length} 个平台 · ${m.total_items} 条 → ${D.topics.length} 个话题`;
  $('#tabs').innerHTML = TABS.map(([k,n,c]) => `<div class="tab ${state.tab===k?'on':''}" data-tab="${k}">${n}<span class="n">${c()}</span></div>`).join('');
  document.querySelectorAll('.tab').forEach(el => el.onclick = () => { state.tab = el.dataset.tab; render(); });
}

function renderBar(){
  const t = state.tab;
  if (t === 'monitor') { $('#bar').innerHTML = ''; return; }
  const chips = t === 'overseas_news' ? '' : `<span class="meta">分类：</span><span class="chip ${state.cat ? '' : 'on'}" data-cat="">全部</span>${[...D.meta.categories, '其他'].map(c=>`<span class="chip ${state.cat===c?'on':''}" data-cat="${c}">${c}</span>`).join('')}`;   // 「其他」只在筛选栏追加，不属于 CATEGORIES
  const search = ['pool','wxs'].includes(t) ? '' : `<input type="search" id="q" placeholder="搜索标题 / 关键词…" value="${esc(state.q)}">`;
  const mp = ['rec','new'].includes(t) ? `<select id="mp">${[1,2,3,4].map(n=>`<option value="${n}" ${state.minPlat==n?'selected':''}>≥${n} 个平台</option>`).join('')}</select>` : '';
  const poolBtns = t==='pool' && pool.length ? '<button id="exp">复制为 Markdown</button><button id="clr">清空选题池</button>' : '';
  $('#bar').innerHTML = search + chips + mp + poolBtns;
  if ($('#q')) $('#q').oninput = e => { state.q = e.target.value; renderMain(); };
  document.querySelectorAll('[data-cat]').forEach(el => el.onclick = () => {
    const c = el.dataset.cat; state.cat = (c && state.cat === c) ? '' : c; render(); });
  if ($('#mp')) $('#mp').onchange = e => { state.minPlat = +e.target.value; renderMain(); };
}

function filterTopics(list){
  const q = state.q.trim().toLowerCase();
  return list.filter(t =>
    (!q || (t.title + t.platforms.map(p=>p.title).join(' ') + t.desc).toLowerCase().includes(q)) &&
    hasCat(t) &&
    t.n_platforms >= state.minPlat);
}

const groupOf = k => (D.status.find(s => s.key === k) || {}).group;
const safeWxUrl = u => typeof u === 'string' && u.startsWith('https://mp.weixin.qq.com/') ? u : '';
const CARD_SRC_ITEMS = {};
function platChip(p){
  let ch = '';
  if (p.is_new) ch = `<span class="badge b-new" title="${esc(newAge(p.first_seen))}">新${p.first_seen ? ' · ' + esc(newAge(p.first_seen)) : ''}</span>`;
  else if (p.rank_change > 0) ch = `<span class="b-up"> ↑${p.rank_change}</span>`;
  else if (p.rank_change < 0) ch = `<span class="b-down"> ↓${-p.rank_change}</span>`;
  return `<a class="pl" style="border-left-color:var(--g-${groupOf(p.source)})" href="${esc(safeUrl(p.url))}" target="_blank" title="${esc(p.title)}">${esc(p.name)} <b>#${p.rank}</b>${ch}</a>`;
}

const heatTip = t => t.platforms.map(p => `${p.name} #${p.rank}：+${p.heat.toFixed(1)}`).join('\n') + `\n合计：${t.heat.toFixed(1)}`;
// 右侧栏：大号数字 + 标签 + 一行小字（热点时事等话题卡片共用）
const sideBox = (label, big, tip, cats, foot, tagLabel = '所属标签') => `<div class="score"><div>${label}</div><div class="big" title="${esc(tip)}">${big}</div>
      <div class="sub">${tagLabel}</div><div>${catBadges(cats)}</div><div class="meta">${foot}</div></div>`;

// o 可覆盖标题 / 链接 / 平台小标签 / 右侧栏内容
function topicCard(t, i, o = {}){
  const age = t.on_board_h >= 1 ? `<span class="badge b-tag">在榜 ${t.on_board_h < 24 ? t.on_board_h.toFixed(0)+'h' : (t.on_board_h/24).toFixed(1)+'天'}</span>` : '';
  const others = t.others.length ? `<details><summary>同事件其它标题 ${t.others.length} 条</summary><ul>${t.others.map(o=>`<li><a href="${esc(safeUrl(o.url))}" target="_blank">[${esc(o.source)}] ${esc(o.title)}</a></li>`).join('')}</ul></details>` : '';
  return `<div class="card">
    <div class="rk">${i+1}<small>#${t.id}</small></div>
    <div>
      <div class="ttl">${o.badges || ''}${t.is_new ? '<span class="badge b-new">新上榜</span>' : ''}${t.n_platforms>=2 ? `<span class="badge b-multi">${t.n_platforms}平台共振</span>` : ''}<a href="${esc(safeUrl(o.url || t.platforms[0].url))}" target="_blank">${esc(o.title || t.title)}</a></div>
      ${t.keyword_fallback ? '<div class="meta">本条为关键词兜底</div>' : ''}
      ${t.desc ? `<div class="desc">${esc(t.desc)}</div>` : ''}
      <div class="plats">${o.plats ?? t.platforms.map(platChip).join('')}</div>
      <div>${t.event ? `<span class="badge b-ev" data-ev="${esc(t.event.word)}" title="点击查看该事件全部话题">🔥 ${esc(t.event.word)} · ${t.event.n_items}条/${t.event.n_platforms}平台</span>` : ''}${age}</div>
      ${others}${wechatBlock(t)}
      <div class="acts"><button data-save="${t.id}" class="${inPool(t.title)?'saved':''}">${inPool(t.title)?'已加入选题池':'＋ 加入选题池'}</button><button data-copy="${t.id}">复制标题</button></div>
    </div>
    ${o.side ?? sideBox('热度', t.heat.toFixed(1), heatTip(t), t.categories, `来自 ${t.n_platforms} 个平台`)}
  </div>`;
}

const ageText = ts => { const h = (Date.now()/1000 - ts) / 3600;
  return h < 1 ? '不到 1 小时前' : h < 24 ? Math.floor(h) + ' 小时前' : Math.floor(h/24) + ' 天前'; };
function wechatBlock(t){
  if (!t.wechat_search_url) return '';
  const link = `<a href="${esc(safeUrl(t.wechat_search_url))}" target="_blank">在搜狗微信查看全部</a>`;
  if (!t.wechat_articles) return `<div class="meta wx">${link}</div>`;
  const at = t.wechat_fetched_at ? ` · 检索于 ${new Date(t.wechat_fetched_at*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}${t.wechat_stale ? '（缓存）' : ''}` : '';
  if (!t.wechat_articles.length) return `<div class="meta wx">公众号暂无同题文章（搜狗首页 0 条，关键词「${esc(t.wechat_keyword)}」${at}）· ${link}</div>`;
  const lt = t.wechat_latest_ts || Math.max(0, ...t.wechat_articles.map(a => a.ts || 0));
  const latest = lt ? ` · 最近 ${ageText(lt)}` : '';
  return `<details class="wx"><summary>公众号已有同题文章 ${t.wechat_page_n} 篇（搜狗首页）${latest} · 近 24 小时 ${t.wechat_24h} 篇</summary><ul>${
    t.wechat_articles.map(a => `<li><a href="${esc(safeUrl(a.url))}" target="_blank">${esc(a.title)}</a> <span class="meta">${esc(a.account)}${a.ts ? ' · ' + ageText(a.ts) : ''}</span></li>`).join('')
  }</ul><div class="meta">关键词「${esc(t.wechat_keyword)}」${at} · ${link}</div></details>`;
}

function bindCardActions(){
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = () => {
    const t = topicById(+b.dataset.save);
    if (inPool(t.title)) pool = pool.filter(p => p.title !== t.title);
    else pool.unshift({title:t.title, url:t.platforms[0].url, platforms:t.platforms.map(p=>p.name+'#'+p.rank).join('、'),
                       categories:t.categories, keyword_fallback:t.keyword_fallback, note:'', added:D.meta.generated});
    savePool(); renderHeader(); renderMain();
  });
  document.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => goWord(b.dataset.ev));
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    const t = topicById(+b.dataset.copy);
    navigator.clipboard.writeText(t.title); b.textContent = '已复制'; setTimeout(()=>b.textContent='复制标题', 1200);
  });
  document.querySelectorAll('[data-cardsave]').forEach(b => b.onclick = () => {
    const key = b.dataset.cardsave, item = (CARD_SRC_ITEMS[key] || [])[+b.dataset.cardidx];
    if (!item) return;
    if (inPool(item.title)) pool = pool.filter(p => p.title !== item.title);
    else pool.unshift({title:item.title, url:key === 'overseas_news' ? safeUrl(item.url) : safeWxUrl(item.url),
      platforms:key === 'overseas_news' ? `${item.media_display}#${item.rank}` : `${key === 'wechat_hot' ? '微信热文' : '低粉爆文'}#${item.rank}`,
      categories:item.categories || [], keyword_fallback:false, note:'', added:D.meta.generated});
    savePool(); renderHeader(); renderMain();
  });
  document.querySelectorAll('[data-cardtitle]').forEach(b => b.onclick = () => {
    const item = (CARD_SRC_ITEMS[b.dataset.cardtitle] || [])[+b.dataset.cardidx];
    if (!item) return;
    navigator.clipboard.writeText(item.title); b.textContent = '已复制'; setTimeout(()=>b.textContent='复制标题', 1200);
  });
}

function renderTopics(list, emptyMsg, note = ''){
  const f = filterTopics(list).slice(0, 150);
  $('#main').innerHTML = statusLine() + note + (f.length ? f.map(topicCard).join('') : `<div class="empty">${emptyMsg || '没有符合条件的话题'}</div>`);
  bindCardActions();
}

function statusLine(){
  const bad = D.status.filter(s => s.error), ws = D.meta.wechat_search || {};
  return (bad.length ? `<div class="note">⚠️ ${bad.map(s=>s.name).join('、')} 抓取失败（接口变动或限流），其余平台不受影响。</div>` : '')
    + (PUBLIC ? '' : ws.blocked ? `<div class="note">⚠️ 搜狗触发验证，本次跳过剩余 ${ws.skipped} 个话题的同题检索（已成功 ${ws.ok} 个，不会尝试绕过验证）。</div>` : '')
    + (PUBLIC ? '' : !ws.blocked && ws.failed ? `<div class="note">⚠️ 搜狗同题检索有 ${ws.failed} 个话题失败${ws.skipped ? `，另跳过 ${ws.skipped} 个` : ''}。</div>` : '');
}

function renderBoardCard(b, q){
  const items = b.items.filter(i => (!q || i.title.toLowerCase().includes(q)) && hasCat(i));
  return `<div class="board"><h3>${b.home ? `<a href="${esc(safeUrl(b.home))}" target="_blank">${esc(b.name)}</a>` : esc(b.name)}<span class="meta">${esc(b.group)} · ${items.length === b.items.length ? items.length : items.length + '/' + b.items.length}</span></h3><ol>${
    items.map(i => i.sub ? `<li class="sub-item"><span class="i">${i.rank}</span><div class="lb"><a class="t" href="${esc(safeUrl(i.url))}" target="_blank">${i.is_new?`<span class="badge b-new" title="${esc(newAge(i.first_seen))}">新</span>`:''}${esc(i.title)}${i.rank_change>0?`<span class="b-up"> ↑${i.rank_change}</span>`:''}</a><div class="meta sub">${esc(i.sub).replace(/爆发 ([\d.]+) ?倍/, '爆发 <b>$1</b> 倍')}<span class="h"> · ${esc(i.hot_text || fmtHot(i.hot))}</span> ${catBadges(i.categories)}</div></div></li>` :
      `<li><span class="i">${i.rank}</span><a class="t" href="${esc(safeUrl(i.url))}" target="_blank">${i.is_new?`<span class="badge b-new" title="${esc(newAge(i.first_seen))}">新</span>`:''}${esc(i.title)}${i.rank_change>0?`<span class="b-up"> ↑${i.rank_change}</span>`:''}</a><span class="h">${esc(i.hot_text || fmtHot(i.hot))}</span>${catBadges(i.categories)}</li>`).join('') ||
    `<div class="empty">${state.cat === '其他' ? '没有归入其他的内容' : '没有这个分类的内容'}</div>`}</ol></div>`;
}
function renderBoards(){
  const q = state.q.trim().toLowerCase();
  $('#main').innerHTML = statusLine() + baselineNote() + `<div class="grid">${D.boards.map(b => renderBoardCard(b, q)).join('')}</div>`;
}
const visibleBoardCount = key => ((D.boards.find(b => b.key === key) || {}).items || []).length;
const visibleOverseasNewsCount = () => ((D.overseas_news || {}).items || []).length;
// 微信热文、低粉爆文与海外快讯共用话题卡：过滤后重新编号，保留原序号。
const cleanCardSub = (key, item) => key === 'overseas_news' ? String(item.sub || '') : String(item.sub || '').split(' · ').map(x => x.trim()).filter(x => {
  if (!x) return false;
  if (key === 'wechat_hot') return !/^榜内第\s*\d+\s*名$/.test(x) && !/^\d+(?:\.\d+)?万\+阅读$/.test(x);
  if (key === 'lowfan_hot') return !/^爆发\s*[\d.]+\s*倍$/.test(x) && !/^阅读\s*/.test(x);
  return !/^\d{2}-\d{2}\s+\d{2}:\d{2}(?:\s*发布)?$/.test(x);
}).join(' · ');

function renderCards(key, note){
  const q = state.q.trim().toLowerCase();
  const isOverseasNews = key === 'overseas_news';
  const boards = D.boards.filter(b => b.key === key);
  const staleAt = (boards.find(b => b.data_updated_at) || {}).data_updated_at;
  if (staleAt) note = '数据更新于 ' + staleAt + '。' + (note || '');
  if (!isOverseasNews && !boards.length) { $('#main').innerHTML = '<div class="empty">暂无数据</div>'; return; }
  const sourceItems = isOverseasNews ? ((D.overseas_news || {}).items || []).map(item => ({...item, title:item.title_display || item.title}))
    : boards.flatMap(board => board.items.map(item => ({...item, boardKey:board.key})));
  const items = sourceItems
    .filter(i => (isOverseasNews || hasCat(i)) && (!q || i.title.toLowerCase().includes(q)));
  CARD_SRC_ITEMS[key] = items;
  const cards = items.map((item, index) => {
    const isWx = key === 'wechat_hot' || key === 'lowfan_hot';
    const url = isWx ? safeWxUrl(item.url) : safeUrl(item.url);
    const hot = String(item.hot_text || '');
    const reads = hot.replace(/阅读/g, '');
    const meta = cleanCardSub(key, item);
    const burst = String(item.sub || '').match(/爆发 ([\d.]+) ?倍/);
    let side = key === 'lowfan_hot'
      ? sideBox('爆发', burst ? esc(burst[1]) + '倍' : '—', item.sub || '', item.categories, `阅读 ${esc(reads || '—')}`)
      : sideBox('阅读', esc(reads || '—'), item.hot_text || '', item.categories, `榜内第 ${esc(item.rank)} 名`);
    if (isOverseasNews) {
      const minutes = Math.max(0, Math.floor(Date.now()/60000 - Number(item.published_ts || 0)/60));
      const age = minutes < 60 ? `${minutes} 分钟` : `${Math.floor(minutes/60)} 小时`;
      side = `<div class="score"><div class="big">${esc(age)}</div><div class="meta">前发布</div><div class="sub">来源</div><div class="meta">${esc(item.media_display || '')}</div></div>`;
    }
    const actions = isWx || isOverseasNews
      ? `<button data-cardsave="${key}" data-cardidx="${index}" class="${inPool(item.title)?'saved':''}">${inPool(item.title)?'已加入选题池':'＋ 加入选题池'}</button><button data-cardtitle="${key}" data-cardidx="${index}">复制标题</button>`
      : `<button data-cardtitle="${key}" data-cardidx="${index}">复制标题</button>`;
    return `<div class="card">
      <div class="rk">${index + 1}<small>#${esc(item.rank)}</small></div>
      <div>
        <div class="ttl">${isOverseasNews && item.report_count > 1 ? `<span class="badge b-multi">${esc(item.report_count)} 家报道</span>` : ''}${isOverseasNews && item.paywall ? '<span class="badge b-tag">付费墙</span>' : ''}${url ? `<a href="${esc(safeUrl(url))}" target="_blank">${esc(item.title)}</a>` : esc(item.title)}</div>
        <div class="meta">${esc(meta)}</div>
        ${isOverseasNews && item.summary_display ? `<div class="desc">${esc(item.summary_display)}</div>` : ''}
        <div class="acts">${actions}</div>
      </div>
      ${side}
    </div>`;
  }).join('');
  const failures = isOverseasNews ? ((D.overseas_news || {}).statuses || []).filter(s => !s.ok).map(s => s.message).filter(Boolean) : [];
  $('#main').innerHTML = `<p class="meta">${esc(note)}</p>`
    + (failures.length ? `<div class="note">⚠️ ${failures.map(esc).join('<br>')}</div>` : '')
    + (cards ? `<div class="wxcards">${cards}</div>` : '<div class="empty">没有符合条件的文章</div>');
  bindCardActions();
}
const fmtHot = h => !h ? '' : h >= 1e8 ? (h/1e8).toFixed(1)+'亿' : h >= 1e4 ? (h/1e4).toFixed(h>=1e6?0:1)+'万' : String(Math.round(h));

function goWord(w){ state.tab = 'rec'; state.q = w; state.minPlat = 1; state.cat = ''; render(); window.scrollTo(0,0); }
// 数字统一用 万/亿：790.5万、1211万、1.23亿
// 名次/指数的涨跌都和「约 24 小时前的快照」比，不是上一次更新；没有基准时如实提示
const baselineNote = () => { const b = D.meta.baseline || {};
  return b.available ? `<div class="note">名次、指数的涨跌对比的是约 24 小时前（${b.at}）的快照，不是上一次更新。</div>`
    : `<div class="note">对比数据不足：名次、指数的涨跌对比的是约 24 小时前的快照，需要至少 1 天的历史数据${b.since ? `（历史数据从 ${b.since} 开始记录）` : ''}。</div>`; };
// 平台自带的标记：微博 label_name、头条 LabelDesc、百度 hotTag=3（页面上显示「热」）；抖音的 label 数字没法核实含义，不显示
const officialBadge = p => { const b = p.badge || {};
  const t = p.source === 'weibo' ? b.label_name : p.source === 'toutiao' ? b.LabelDesc : (p.source === 'baidu' && String(b.hotTag) === '3') ? '热' : '';
  return t ? `<span class="badge b-tag">${esc(t)}</span>` : ''; };
const fmtIdx = v => v == null ? '—' : v >= 1e8 ? (v/1e8).toFixed(2)+'亿' : v >= 1e7 ? Math.round(v/1e4)+'万' : v >= 1e4 ? (v/1e4).toFixed(1)+'万' : String(Math.round(v));
const idxChange = p => !(D.meta.baseline || {}).available ? '<span class="meta">—</span>' : p.is_new ? '<span class="badge b-new">新</span>'
  : p.change == null ? '' : Math.abs(p.change) < 0.005 ? '<span class="meta">持平</span>'
  : p.change > 0 ? `<span class="b-up">↑${Math.round(p.change*100)}%</span>` : `<span class="b-down">↓${Math.round(-p.change*100)}%</span>`;
const sinceAge = ts => { const h = (Date.now()/1000 - ts) / 3600; return h < 1 ? '刚刚' : Math.floor(h) + ' 小时前'; };
const groupColor = src => `style="border-left-color:var(--g-${groupOf(src)})"`;
// ---- 检索微信文章：全部在访问者自己的浏览器里完成（新标签页打开搜狗微信），页面本身不请求搜狗，也不经过任何服务器
const WX_TOP = 30, WX_GAP_MS = 3000;
const WX_LIMIT = (D.meta.wx_search_daily_limit ?? 30);
const wxToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const wxMem = {};   // localStorage 不可用（隐私模式）时退回内存计数
const wxGet = k => { try { return localStorage.getItem(k); } catch (e) { return wxMem[k] ?? null; } };
const wxSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { wxMem[k] = String(v); } };
function wxUsed(){   // 按自然日计数（key 带日期），顺手清掉往天的
  const key = 'wxs-count-' + wxToday();
  try { Object.keys(localStorage).filter(k => k.startsWith('wxs-count-') && k !== key).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  return +(wxGet(key) || 0);
}
const wxLeft = () => Math.max(0, WX_LIMIT - wxUsed());
function wxCopy(text){
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return ok; };
  return (navigator.clipboard && navigator.clipboard.writeText) ? navigator.clipboard.writeText(text).then(() => true, fallback) : Promise.resolve(fallback());
}
window.__goWeixin = () => { location.href = 'weixin://'; };   // 单独挂在 window 上，方便测试时替换
function wxMsg(t){ const m = $('#wxmsg'); if (m) m.textContent = t; }
function wxRefresh(){
  const left = wxLeft();
  document.querySelectorAll('[data-wxgo]').forEach(b => b.disabled = left <= 0);
  const r = $('#wxleft'); if (r) r.textContent = left > 0 ? `今日剩余 ${left} 次` : '今日检索次数已用完，明天再来';
}
function wxSearch(kw){
  kw = (kw || '').trim();
  if (!kw) { wxMsg('请先输入关键词'); return; }
  if (wxLeft() <= 0) { wxMsg('今日检索次数已用完，明天再来'); wxRefresh(); return; }
  const last = +(wxGet('wxs-last') || 0), wait = WX_GAP_MS - (Date.now() - last);
  if (wait > 0) { wxMsg(`两次搜索至少间隔 3 秒，请 ${Math.ceil(wait/1000)} 秒后再试`); return; }
  wxSet('wxs-last', Date.now()); wxSet('wxs-count-' + wxToday(), wxUsed() + 1);
  window.open('https://weixin.sogou.com/weixin?type=2&query=' + encodeURIComponent(kw), '_blank', 'noopener,noreferrer');
  wxMsg(`已在新标签页打开搜狗微信搜索「${kw}」`); wxRefresh();
}
function wxCopyGo(kw){
  kw = (kw || '').trim();
  if (!kw) { wxMsg('请先输入关键词'); return; }
  const ua = navigator.userAgent, inWx = /MicroMessenger/i.test(ua), mobile = /iPhone|Android/i.test(ua) && !inWx;
  wxCopy(kw).then(ok => {
    if (!ok) { wxMsg('复制失败，请手动复制关键词：' + kw); return; }
    if (inWx) wxMsg('已复制，返回微信顶部搜索框粘贴');
    else if (mobile) { wxMsg('已复制，正在打开微信，到搜一搜里粘贴…'); setTimeout(() => window.__goWeixin(), 300); }
    else wxMsg('已复制，到手机或电脑微信的搜一搜里粘贴');
  });
}
function renderWxs(){
  const R = D.topics.slice(0, WX_TOP).filter(hasCat);
  $('#main').innerHTML = `<div class="wxbox">
      <div><input type="search" id="wxq" placeholder="输入要在公众号里搜的关键词…" value="${esc(state.wxq)}">
        <button id="wxgo" data-wxgo class="primary">搜狗微信搜索</button> <button id="wxcopy">复制 · 去微信搜一搜</button>
        <span class="meta" id="wxleft"></span></div>
      <div class="wxmsg" id="wxmsg"></div>
      <div class="meta">· 「搜狗微信搜索」会在新标签页打开搜狗微信（由你的浏览器直接访问，本页不代为请求）；搜狗偶尔会要求你输入验证码，这是正常的。<br>
        · 微信没有公开的「搜一搜」直达链接，只能先复制关键词，再到微信的搜一搜里手动粘贴；手机浏览器里点「复制 · 去微信搜一搜」会尝试打开微信 App。<br>
        · 每个浏览器每天最多 ${WX_LIMIT} 次搜狗微信搜索（按本浏览器自己的计数，复制不计次数），两次之间至少间隔 3 秒。</div></div>
    <div class="note">热度前 ${WX_TOP} 的话题的建议关键词（按标题自动生成：去掉栏目名、比分和日期，取前几个词），点「搜狗搜索」会先填进上面的搜索框。分类栏可筛选。</div>`
    + (R.length ? R.map((t,i) => `<div class="wxr"><div class="rk">${i+1}</div>
        <div><div class="ttl">${esc(t.title)} ${catBadges(t.categories)}</div><div class="meta">建议关键词：<b>${esc(t.wx_keyword)}</b></div></div>
        <div><button data-wxgo data-kw="${esc(t.wx_keyword)}">搜狗搜索</button> <button data-wxcopy data-kw="${esc(t.wx_keyword)}">复制 · 去搜一搜</button></div></div>`).join('')
      : `<div class="empty">${state.cat === '其他' ? '没有归入其他的话题' : '没有这个分类的话题'}</div>`);
  $('#wxq').oninput = e => { state.wxq = e.target.value; };
  $('#wxq').onkeydown = e => { if (e.key === 'Enter') wxSearch(state.wxq); };
  $('#wxgo').onclick = () => wxSearch(state.wxq);
  $('#wxcopy').onclick = () => wxCopyGo(state.wxq);
  document.querySelectorAll('[data-wxgo][data-kw]').forEach(b => b.onclick = () => { state.wxq = b.dataset.kw; $('#wxq').value = b.dataset.kw; wxSearch(b.dataset.kw); });
  document.querySelectorAll('[data-wxcopy]').forEach(b => b.onclick = () => wxCopyGo(b.dataset.kw));
  wxRefresh();
}

// ---- 公众号监控：「查看」时间选择存在浏览器 localStorage，不为每次查看发服务器请求。
const monDate = value => { if(!value)return null; let text=String(value); if(/^\d{1,2}-\d{1,2}(?:\s|$)/.test(text))text=`${new Date().getFullYear()}-${text}`; return new Date(text.replace(' ', 'T')); };
const monFmt = (value, full=false) => { const d=monDate(value); if (!d || Number.isNaN(d.getTime())) return '—';
  const opt = full ? {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false} : {hour:'2-digit',minute:'2-digit',hour12:false};
  return d.toLocaleString('zh-CN', opt).replace(/\//g,'-'); };
function monViewedBefore(name){
  if (PUBLIC) return null;
  if (!(name in state.monitorViewed)) {
    const key = 'monitor-viewed-' + name;
    let old = ''; try { old = localStorage.getItem(key) || ''; localStorage.setItem(key, new Date().toISOString()); } catch(e) {}
    state.monitorViewed[name] = old;
  }
  return monDate(state.monitorViewed[name]);
}
function renderMonitor(){
  if (!PUBLIC && window.loadMonitor && !window.monitorLoaded) window.loadMonitor();
  const accounts = D.monitor?.accounts || [];
  const tools = PUBLIC ? '' : `<div class="monitor-tools"><input id="monname" type="search" maxlength="30" placeholder="输入公众号名（1~30 个字符）"><button id="monadd" class="primary">添加监控</button><span id="monmsg" class="monitor-status"></span></div>`;
  const truth = `<div class="note">数据来源：搜狗微信公开搜索。没有阅读数、在看数；以搜狗收录为准，可能不全。</div>`;
  const cards = accounts.map(a => {
    const p=a.profile||{}, s=a.stats||{}, recent=s.recent_10||[], viewed=monViewedBefore(a.name);
    const latest=s.latest_article, pending=a.last_article_check_status==='pending'||(a.last_article_check_status==='not_found'&&!a.last_article_check_at);
    const bad=!pending&&['blocked','failed','not_found'].includes(a.last_article_check_status);
    const dataAt=recent.map(x=>x.last_seen_at).filter(Boolean).sort().pop();
    const status = pending ? '<div class="monitor-status">等待首次检索：每天 08:00 后首次定时更新，或点「立即检索」（占当日手动次数）</div>' : bad ? `<div class="monitor-status bad">最近一次检索（${monFmt(a.last_article_check_at,true)}）：${esc(a.last_article_check_message||a.last_article_check_status)}${dataAt ? ` · 当前旧数据来自 ${monFmt(dataAt,true)}` : ''}</div>`
      : `<div class="monitor-status">数据更新于 ${monFmt(a.last_article_check_at)}</div>`;
    const actions = PUBLIC ? '' : `<div class="acts"><button data-monrefresh="${esc(a.name)}">立即检索</button><button data-monremove="${esc(a.name)}">移除</button></div>`;
    const profile = D.monitor?.profile_enabled===true ? `${p.wechat_id?`<div>微信号：${esc(p.wechat_id)}</div>`:''}${p.intro?`<div>简介：${esc(p.intro)}</div>`:''}${p.verified?`<div>认证：${esc(p.verified)}</div>`:''}${p.message?`<div>${esc(p.message)}${p.updated_at ? ` · 旧资料来自 ${monFmt(p.updated_at,true)}` : ''}</div>`:''}` : '';
    const articles = recent.length ? `<ol class="monitor-list">${recent.map(x => { const first=monDate(x.first_seen_at), fresh=first && (!viewed || first>viewed);
      const title=x.link?`<a href="${esc(safeUrl(x.link))}" target="_blank">${esc(x.title)}</a>`:esc(x.title);
      const hits=(x.hot_topics||[]).length?` <span class="badge b-ev">🔥 ${esc(x.hot_topics.join('、'))}</span>`:'';
      return `<li>${!PUBLIC&&fresh?'<span class="badge b-new">新</span>':''}${title}${hits} <span class="meta">${monFmt(x.published_at||x.first_seen_at,true)}${x.date_basis==='first_seen_at'?' · 按首次收录时间':''}</span></li>`; }).join('')}</ol>`
      : `<div class="meta">尚无累计收录的文章</div>`;
    return `<section class="monitor-card"><div class="monitor-head"><div><div class="ttl">${esc(a.name)}</div>${status}</div>${actions}</div>
      <div class="monitor-profile">${profile}</div><div class="monitor-stats"><span>最近收录：<b>${latest?monFmt(latest.published_at||latest.first_seen_at,true):'—'}</b></span><span>近 7 天 收录 <b>${s.count_7d||0}</b> 篇</span><span>近 30 天 收录 <b>${s.count_30d||0}</b> 篇</span></div>
      <div class="meta">只统计搜狗按名称检索到的本号文章，通常远少于实际发文量，不代表发文频率。${s.used_first_seen_fallback?' 缺失发布时间的文章按首次收录时间计数。':''}</div>
      ${(a.hot_topics||[]).length?`<div class="meta">蹭热点：${esc(a.hot_topics.join('、'))}</div>`:''}${articles}</section>`;
  }).join('');
  $('#main').innerHTML = tools + truth + (cards || `<div class="empty">还没有监控的公众号</div>`);
  if (!PUBLIC && window.bindMonitorActions) window.bindMonitorActions();
}
const onBoard = h => h == null ? '' : h >= 48 ? Math.floor(h/24) + ' 天' : Math.floor(h) + ' 小时';
const onBoardShort = h => h == null ? '' : h >= 48 ? Math.floor(h/24) + '天' : Math.floor(h) + 'h';
function renderPool(){
  renderSavedPool($('#main'), hasCat);
  bindPoolBar();
}

function renderOverseasNews(){
  const translationState = ((((D.overseas_news || {}).meta || {}).translation || {}).translation);
  renderCards('overseas_news', '来源：彭博市场/政治/科技、CNBC 头条、纽约时报头版、谷歌新闻美国头条。只显示 24 小时内内容。' + (['disabled','pool_disabled','exhausted','daily_cap','key_invalid'].includes(translationState) ? '翻译已暂停，显示英文原文。' : '标题与摘要由 AI 翻译，仅供参考。'));
}

function renderHealthFeeds(health){
  // 行业/政策类默认显示（灰色「行业」标签），勾选「隐藏行业/政策类」后才收起。
  let hideIndustry = false;
  try { hideIndustry = localStorage.getItem('health-hide-industry') === '1'; } catch(e) {}
  const statuses = sources => (health.statuses || []).filter(source => sources.includes(source.source)).map(source => `<div class="meta">${esc(source.name)}${(source.messages || []).map(message => `<div>${esc(message)}</div>`).join('')}</div>`).join('');
  const cards = (items, industryToggle) => items.length ? items.map(item => `<article class="note" ${industryToggle && item.category === '行业' ? `data-health-industry ${hideIndustry ? 'hidden' : ''}` : ''}>
    <a href="${esc(safeUrl(item.url))}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a>
    <div class="meta">${esc(item.source_name)} · ${esc(item.date)}${item.category === '行业' ? ' · <span style="color:#888888">行业</span>' : ''}</div></article>`).join('') : '<div class="empty">暂无带发布日期的缓存文章</div>';
  return `<section><h3>健康科普新文</h3><div class="meta">最近 14 天，按发布日期倒序</div>
    <label><input id="health-industry" type="checkbox" ${hideIndustry ? 'checked' : ''}>隐藏行业/政策类</label>
    ${statuses(['people', 'jkb'])}${cards(health.news || [], true)}</section>
    <section><h3>丁香医生常青科普</h3><div class="meta">常青科普，非当日新闻</div>${statuses(['dxy'])}${cards(health.evergreen || [], false)}</section>`;
}

function renderSavedPool(target, filter){
  if (!pool.length) { target.innerHTML = '<div class="empty">选题池是空的。在「热点时事」里点「＋ 加入选题池」收藏，保存在本浏览器里，跨天保留。</div>'; return; }
  const shown = pool.map((p,i) => [p,i]).filter(([p]) => filter(p));   // i 是在 pool 里的真实下标，删除/备注靠它
  if (!shown.length) { target.innerHTML = '<div class="empty">选题池里没有这个分类的选题</div>'; return; }
  target.innerHTML = shown.map(([p,i], n) => `<div class="card pool" style="grid-template-columns:32px 1fr auto">
    <div class="rk">${n+1}</div>
    <div><div class="ttl"><a href="${esc(safeUrl(p.url))}" target="_blank">${esc(p.title)}</a></div>
      ${p.keyword_fallback ? '<div class="meta">本条为关键词兜底</div>' : ''}
      <div class="meta">${esc(p.platforms)} · 收藏于 ${esc(p.added)}</div>
      <div>${catBadges(p.categories)}</div>
      <textarea data-note="${i}" placeholder="写下切入角度、标题草稿、素材链接…">${esc(p.note)}</textarea></div>
    <div><button data-del="${i}">移除</button></div></div>`).join('');
  document.querySelectorAll('[data-note]').forEach(t => t.oninput = () => { pool[t.dataset.note].note = t.value; savePool(); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { pool.splice(+b.dataset.del, 1); savePool(); render(); });
}

function bindPoolBar(){
  if ($('#exp')) $('#exp').onclick = () => {
    const md = '# 选题池\n\n' + pool.map((p,i) => `${i+1}. [${p.title}](${safeUrl(p.url)})\n   - 平台：${p.platforms}${p.categories && p.categories.length ? '\n   - 分类：' + p.categories.join('、') : ''}${p.note ? '\n   - 思路：' + p.note.replace(/\n/g, '\n     ') : ''}`).join('\n');
    navigator.clipboard.writeText(md); $('#exp').textContent = '已复制';
  };
  if ($('#clr')) $('#clr').onclick = () => { if (confirm('清空选题池？')) { pool = []; savePool(); render(); } };
}

function renderMain(){
  const T = D.topics;
  switch (state.tab){
    case 'overseas_news': renderOverseasNews(); break;
    case 'wechat_hot': renderCards('wechat_hot', '来源：第三方聚合（试用），榜内排名。'); break;
    case 'lowfan_hot': renderCards('lowfan_hot', '来源：第三方聚合（试用），T+1 榜单（榜单日期见每条发布日期）。爆发倍数 = 这篇阅读 ÷ 账号日常阅读。'); break;
    case 'rec': return renderTopics(T);
    case 'new': return renderTopics(T.filter(t => t.is_new || t.platforms.some(p => p.rank_change > 0)).sort((a,b) => newN(b) - newN(a) || b.heat - a.heat),
                  D.meta.first_run ? '这是首次运行，还没有历史可对比。' : '暂无新上榜话题', baselineNote());
    case 'boards': return renderBoards();
    case 'wxs': return renderWxs();
    case 'monitor': return renderMonitor();
    case 'pool': return renderPool();
  }
}
function render(){ renderHeader(); renderBar(); renderMain(); }
render();


</script>
